name: CI/CD perpulangan

on:
  push:
    branches:
      - main

jobs:
  start_notify:
    runs-on: ubuntu-latest
    outputs:
      project_name: ${{ steps.get_project_info.outputs.project_name }}
      project_version: ${{ steps.get_project_info.outputs.project_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Get Project Info
        id: get_project_info
        run: |
          if command -v jq &> /dev/null; then
            echo "project_name=$(jq -r .name package.json)" >> "$GITHUB_OUTPUT"
            echo "project_version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"
          else
            echo "project_name=perpulangan" >> "$GITHUB_OUTPUT"
            echo "project_version=v1.0.0" >> "$GITHUB_OUTPUT"
          fi

      - name: Set Timestamp
        run: echo "TIMESTAMP=$(date +'%Y-%m-%d %H:%M:%S %Z')" >> "$GITHUB_ENV"

      - name: Notify Start
        run: |
          curl -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN_NOTIFICATION }}/sendMessage" \
          -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
          -d "text=🚀 CI/CD Started%0A📦 Project: ${{ steps.get_project_info.outputs.project_name }}%0A🔖 Version: ${{ steps.get_project_info.outputs.project_version }}%0A🕒 Time: ${{ env.TIMESTAMP }}%0AGithub Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  build:
    needs: start_notify
    runs-on: ubuntu-latest
    outputs:
      build_status: ${{ job.status }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Verify pnpm-lock.yaml exists
        run: |
          if [ -f "pnpm-lock.yaml" ]; then
            echo "pnpm-lock.yaml found"
          else
            echo "Error: pnpm-lock.yaml not found. Please commit it."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "24.x"

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9.15.2

      - name: Cache pnpm store
        uses: actions/cache@v3
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Cache node_modules
        uses: actions/cache@v3
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Cache Next.js build cache
        uses: actions/cache@v3
        with:
          path: ./.next/cache
          key: ${{ runner.os }}-nextjs-build-${{ hashFiles('**/pnpm-lock.yaml', '**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-build-

      - name: Create .env file
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          BETTER_AUTH_URL: ${{ secrets.BETTER_AUTH_URL }}
          LOG_LEVEL: ${{ secrets.LOG_LEVEL || 'warn' }}
          NEXT_PUBLIC_LOG_LEVEL: ${{ secrets.NEXT_PUBLIC_LOG_LEVEL || 'error' }}
          NEXT_PUBLIC_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_API_BASE_URL }}
          NEXT_PUBLIC_API_KEY: ${{ secrets.NEXT_PUBLIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_PAYMENT_EVIDENCE_BUCKET: ${{ secrets.SUPABASE_PAYMENT_EVIDENCE_BUCKET || 'payment-evidence' }}
          TRACK_API_URL: ${{ secrets.TRACK_API_URL }}
          TRACK_ADMIN_API_KEY: ${{ secrets.TRACK_ADMIN_API_KEY }}
          NEXT_PUBLIC_APP_VERSION: ${{ needs.start_notify.outputs.project_version || '1.0.0' }}
        run: |
          umask 077
          : > .env
          for name in DATABASE_URL BETTER_AUTH_SECRET BETTER_AUTH_URL LOG_LEVEL NEXT_PUBLIC_LOG_LEVEL \
            NEXT_PUBLIC_API_BASE_URL NEXT_PUBLIC_API_KEY SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY \
            SUPABASE_PAYMENT_EVIDENCE_BUCKET TRACK_API_URL TRACK_ADMIN_API_KEY NEXT_PUBLIC_APP_VERSION; do
            printf '%s=%s\n' "$name" "${!name}" >> .env
          done
          printf '%s\n' 'HUSKY=0' >> .env

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Next.js app
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: pnpm build

      - name: Apply database migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm prisma migrate deploy

      - name: Package artifacts
        run: |
          mkdir -p .next/standalone/public .next/standalone/.next/static
          cp -a public/. .next/standalone/public/
          cp -a .next/static/. .next/standalone/.next/static/
          cp ecosystem.config.cjs .next/standalone/ecosystem.config.cjs
          tar -czf build-files.tar.gz -C .next/standalone .

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: perpulangan-build-tarball
          path: build-files.tar.gz
          retention-days: 1

  deploy:
    needs: [build, start_notify]
    runs-on: ubuntu-latest
    concurrency:
      group: perpulangan-production-deploy
      cancel-in-progress: false
    env:
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_IP: ${{ secrets.VPS_IP }}
      RELEASE_ID: ${{ github.sha }}-${{ github.run_attempt }}
      APP_PORT: ${{ secrets.APP_PORT || '3000' }}
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: perpulangan-build-tarball
          path: ./

      - name: Add SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add known hosts entry
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan "$VPS_IP" >> ~/.ssh/known_hosts

      - name: Create runtime environment file
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          BETTER_AUTH_URL: ${{ secrets.BETTER_AUTH_URL }}
          LOG_LEVEL: ${{ secrets.LOG_LEVEL || 'warn' }}
          NEXT_PUBLIC_LOG_LEVEL: ${{ secrets.NEXT_PUBLIC_LOG_LEVEL || 'error' }}
          NEXT_PUBLIC_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_API_BASE_URL }}
          NEXT_PUBLIC_API_KEY: ${{ secrets.NEXT_PUBLIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_PAYMENT_EVIDENCE_BUCKET: ${{ secrets.SUPABASE_PAYMENT_EVIDENCE_BUCKET || 'payment-evidence' }}
          TRACK_API_URL: ${{ secrets.TRACK_API_URL }}
          TRACK_ADMIN_API_KEY: ${{ secrets.TRACK_ADMIN_API_KEY }}
          NEXT_PUBLIC_APP_VERSION: ${{ needs.start_notify.outputs.project_version || '1.0.0' }}
        run: |
          umask 077
          : > runtime.env
          for name in DATABASE_URL BETTER_AUTH_SECRET BETTER_AUTH_URL LOG_LEVEL NEXT_PUBLIC_LOG_LEVEL \
            NEXT_PUBLIC_API_BASE_URL NEXT_PUBLIC_API_KEY SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY \
            SUPABASE_PAYMENT_EVIDENCE_BUCKET TRACK_API_URL TRACK_ADMIN_API_KEY NEXT_PUBLIC_APP_VERSION; do
            printf '%s=%s\n' "$name" "${!name}" >> runtime.env
          done
          printf '%s\n' 'HUSKY=0' >> runtime.env

      - name: Prepare release directory
        run: |
          APP_DIR="/home/$VPS_USER/project/perpulangan"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_IP" \
            "mkdir -p '$APP_DIR/releases/$RELEASE_ID' '$APP_DIR/incoming/$RELEASE_ID'"
          rsync -avz build-files.tar.gz runtime.env \
            "$VPS_USER@$VPS_IP:$APP_DIR/incoming/$RELEASE_ID/"

      - name: Install release and activate with rollback
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_IP" \
            "APP_DIR='/home/$VPS_USER/project/perpulangan' RELEASE_ID='$RELEASE_ID' APP_PORT='$APP_PORT' bash -s" <<'EOF'
          set -Eeuo pipefail

          RELEASE_DIR="$APP_DIR/releases/$RELEASE_ID"
          INCOMING_DIR="$APP_DIR/incoming/$RELEASE_ID"
          APP_NAME="perpulangan"

          mkdir -p "$RELEASE_DIR"
          tar -xzf "$INCOMING_DIR/build-files.tar.gz" -C "$RELEASE_DIR"
          install -m 600 "$INCOMING_DIR/runtime.env" "$RELEASE_DIR/.env"

          export NVM_DIR="$HOME/.nvm"
          if [ -s "$NVM_DIR/nvm.sh" ]; then
            . "$NVM_DIR/nvm.sh"
          else
            echo "nvm tidak ditemukan pada $NVM_DIR" >&2
            exit 1
          fi
          nvm use 24
          node -v

          PREVIOUS_RELEASE=""
          if [ -L "$APP_DIR/current" ]; then
            PREVIOUS_RELEASE="$(readlink -f "$APP_DIR/current")"
          fi

          ln -sfn "$RELEASE_DIR" "$APP_DIR/current.next"
          mv -Tf "$APP_DIR/current.next" "$APP_DIR/current"

          activate_pm2() {
            PERPULANGAN_APP_DIR="$APP_DIR" APP_PORT="$APP_PORT" \
              pm2 startOrReload "$APP_DIR/current/ecosystem.config.cjs" --update-env
          }

          health_check() {
            local attempt
            for attempt in $(seq 1 20); do
              if curl --fail --silent --show-error --output /dev/null "http://127.0.0.1:$APP_PORT/"; then
                return 0
              fi
              sleep 2
            done
            return 1
          }

          if ! activate_pm2 || ! health_check; then
            echo "Release baru gagal aktif; memulihkan release sebelumnya." >&2
            if [ -n "$PREVIOUS_RELEASE" ] && [ -d "$PREVIOUS_RELEASE" ]; then
              ln -sfn "$PREVIOUS_RELEASE" "$APP_DIR/current.rollback"
              mv -Tf "$APP_DIR/current.rollback" "$APP_DIR/current"
              pm2 restart "$APP_NAME" --update-env || true
              sleep 3
            else
              pm2 delete "$APP_NAME" >/dev/null 2>&1 || true
              rm -f "$APP_DIR/current"
            fi
            pm2 logs "$APP_NAME" --lines 30 --nostream || true
            exit 1
          fi

          pm2 save
          rm -rf "$INCOMING_DIR"

          # Pertahankan lima release terbaru untuk rollback manual.
          mapfile -t OLD_RELEASES < <(
            find "$APP_DIR/releases" -mindepth 1 -maxdepth 1 -type d -printf '%T@ %p\n' \
              | sort -rn | awk 'NR > 5 { $1=""; sub(/^ /, ""); print }'
          )
          for old_release in "${OLD_RELEASES[@]}"; do
            [ "$old_release" = "$RELEASE_DIR" ] || rm -rf -- "$old_release"
          done

          echo "Release aktif: $RELEASE_DIR"
          pm2 describe "$APP_NAME"
          EOF

  notify:
    needs: [start_notify, build, deploy]
    if: always()
    runs-on: ubuntu-latest
    env:
      PROJECT_NAME: ${{ needs.start_notify.outputs.project_name || 'perpulangan' }}
      PROJECT_VERSION: ${{ needs.start_notify.outputs.project_version || 'Unknown Version' }}
      GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Set Timestamp
        run: echo "TIMESTAMP=$(date +'%Y-%m-%d %H:%M:%S %Z')" >> "$GITHUB_ENV"

      - name: Send Telegram Notification
        run: |
          STATUS_ICON="✅"
          STATUS_TEXT="CI/CD Success"
          if [[ "${{ needs.build.result }}" != "success" || "${{ needs.deploy.result }}" != "success" ]]; then
            STATUS_ICON="❌"
            STATUS_TEXT="CI/CD Failed"
          fi

          MESSAGE="<b>$STATUS_ICON $STATUS_TEXT</b>%0A"
          MESSAGE+="📦 Project: $PROJECT_NAME%0A"
          MESSAGE+="🔖 Version: $PROJECT_VERSION%0A"
          MESSAGE+="🕒 Time: $TIMESTAMP%0A"
          MESSAGE+="Github Run: $GITHUB_RUN_URL%0A"
          MESSAGE+="🌍 Port: ${{ secrets.APP_PORT || 3000 }}%0A"

          if [[ "$STATUS_TEXT" == "CI/CD Failed" ]]; then
            MESSAGE+="🚨 Please check logs!"
          fi

          curl -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN_NOTIFICATION }}/sendMessage" \
          -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
          -d "parse_mode=HTML" \
          -d "text=$MESSAGE"
